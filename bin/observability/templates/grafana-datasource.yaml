apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    app.kubernetes.io/part-of: texera-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.loki.service.port }}
        isDefault: true
        editable: true
        jsonData:
          maxLines: 1000
