apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    app.kubernetes.io/part-of: texera-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Texera
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    app.kubernetes.io/part-of: texera-observability
data:
  texera-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Log Volume by App",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum by (app) (count_over_time({namespace=\"{{ .Values.texeraNamespace }}\"} [1m]))",
              "legendFormat": "{{`{{app}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 50,
                "stacking": { "mode": "normal" }
              }
            }
          }
        },
        {
          "title": "Live Logs - All Texera Services",
          "type": "logs",
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "{namespace=\"{{ .Values.texeraNamespace }}\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "title": "Error Logs",
          "type": "logs",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "{namespace=\"{{ .Values.texeraNamespace }}\"} |~ \"(?i)(error|exception|fatal|panic)\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["texera", "logs", "loki"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Texera Application Logs",
      "uid": "texera-logs",
      "version": 1
    }
