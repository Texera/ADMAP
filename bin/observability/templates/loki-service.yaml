apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
    app.kubernetes.io/part-of: texera-observability
spec:
  type: {{ .Values.loki.service.type }}
  ports:
    - name: http
      port: {{ .Values.loki.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: loki
